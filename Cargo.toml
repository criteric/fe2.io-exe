[package]
name = "fe2io-native"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "net", "sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "6"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
